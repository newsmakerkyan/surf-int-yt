<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="Something new is coming soon to surf.int.yt.">
  <title>Coming Soon | surf.int.yt</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f3f8f5;
      background: radial-gradient(ellipse at 50% 0%, rgba(23, 115, 78, .25), transparent 55%), #050a08;
    }
    main { width: min(100%, 760px); text-align: center; padding: clamp(28px, 7vw, 72px) 20px; }
    .mark {
      display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 30px;
      border: 1px solid rgba(93, 235, 170, .32); border-radius: 18px;
      background: rgba(27, 110, 74, .16); color: #68e6aa; font-size: 26px;
      box-shadow: 0 0 44px rgba(43, 202, 128, .10);
    }
    .domain { color: #83e9b7; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
    h1 { margin: 20px 0 16px; font-size: clamp(42px, 8vw, 76px); line-height: 1.02; letter-spacing: -.055em; }
    h1 span { color: #6de5a8; }
    p { max-width: 490px; margin: 0 auto; color: #aab9b1; font-size: clamp(16px, 2.5vw, 18px); line-height: 1.75; }
    .status {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 34px; padding: 10px 15px;
      border: 1px solid rgba(122, 151, 135, .22); border-radius: 999px;
      background: rgba(255,255,255,.035); color: #c7d5cd; font-size: 13px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #6de5a8; box-shadow: 0 0 12px rgba(109,229,168,.8); }
    footer { margin-top: 66px; color: #627168; font-size: 12px; letter-spacing: .03em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <div class="domain">surf.int.yt</div>
    <h1>Something good<br><span>is coming soon.</span></h1>
    <p>We're working on something new. The search experience you’re waiting for is still in the works — check back soon.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Under construction</div>
    <footer>© <span id="year"></span> surf.int.yt</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
